name: SDK version boundary for issue 1578
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/version-boundary.yml'
      - 'runner.py'
      - 'issue_1578_original.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin shared Temporal CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence .devserver
          python -m venv venv-bootstrap
          venv-bootstrap/bin/pip install -q temporalio==1.36.1
          cat > /tmp/get_cli.py <<'PY'
          import asyncio
          from temporalio.testing import WorkflowEnvironment
          async def main():
              async with await WorkflowEnvironment.start_local(download_dest_dir='.devserver'):
                  print('DEV_SERVER_PASS')
          asyncio.run(main())
          PY
          venv-bootstrap/bin/python /tmp/get_cli.py
          CLI="$(find .devserver -type f -perm /u+x | head -n 1)"
          test -n "$CLI"
          echo "TEMPORAL_CLI_PATH=$(realpath "$CLI")" >> "$GITHUB_ENV"
          "$CLI" --version | tee evidence/server.txt
          sha256sum "$CLI" | tee -a evidence/server.txt
      - name: Compare intermediate released SDKs under identical server
        shell: bash
        run: |
          set -euo pipefail
          for version in 1.30.0 1.31.0 1.32.0 1.33.0 1.34.0 1.35.0 1.36.0; do
            echo "::group::SDK $version"
            git clone -q --depth 1 --branch "$version" https://github.com/temporalio/sdk-python.git "sdk-$version"
            {
              echo "SDK=$version"
              git -C "sdk-$version" rev-parse HEAD | sed 's/^/SDK_COMMIT=/'
              git -C "sdk-$version" ls-tree HEAD temporalio/bridge/sdk-core | sed 's/^/CORE_GITLINK=/'
            } | tee -a evidence/versions.txt
            python -m venv "venv-$version"
            "venv-$version/bin/python" -m pip install -q "temporalio==$version"
            "venv-$version/bin/python" -c 'import pathlib,hashlib,temporalio.bridge; path=next(pathlib.Path(temporalio.bridge.__file__).parent.glob("*.so")); print("BRIDGE_SHA256="+hashlib.sha256(path.read_bytes()).hexdigest())' | tee -a evidence/versions.txt
            SDK_VERSION="$version" EVIDENCE_DIR=evidence timeout 180 "venv-$version/bin/python" -u runner.py --mode generate --repeats 4 > "evidence/reproducer-$version.log" 2>&1
            grep -E 'EVIDENCE .*"phase": "original_test"' "evidence/reproducer-$version.log" | sed -E 's/^.*EVIDENCE /EVIDENCE /' | tee -a evidence/versions.txt
            echo "::endgroup::"
          done
      - name: Show boundary summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('evidence/results.jsonl')
          if not path.exists(): raise SystemExit('No results yet')
          rows=[json.loads(x) for x in path.read_text().splitlines()]
          print('VERSION / ORIGINAL / REPLAY FAILURES / HISTORIES')
          versions=['1.30.0','1.31.0','1.32.0','1.33.0','1.34.0','1.35.0','1.36.0']
          for v in versions:
              orig=[r for r in rows if r.get('phase')=='original_test' and r.get('sdk')==v]
              fail=[r for r in rows if r.get('phase')=='same_version_replay' and r.get('sdk')==v and r.get('status')=='FAIL']
              h=[r for r in rows if r.get('phase')=='history_capture' and r.get('sdk')==v]
              print(v, [r['status'] for r in orig],len(fail),len(h))
          PY
      - name: Upload all version-boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-boundary-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
