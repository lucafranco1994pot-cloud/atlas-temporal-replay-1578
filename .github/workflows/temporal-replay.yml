name: Temporal replay issue 1578
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record exact SDK and Core revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          { uname -a; python --version; } > evidence/environment.txt
          for version in 1.27.2 1.36.1; do
            git clone -q --depth 1 --branch "$version" https://github.com/temporalio/sdk-python.git "sdk-$version"
            echo "SDK_TAG=$version" | tee -a evidence/environment.txt
            git -C "sdk-$version" rev-parse HEAD | sed 's/^/SDK_COMMIT=/' | tee -a evidence/environment.txt
            git -C "sdk-$version" ls-tree HEAD temporalio/bridge/sdk-core | tee -a evidence/environment.txt
            git -C "sdk-$version" ls-tree HEAD temporalio/bridge/sdk-core | awk '{print $3}' | sed 's/^/CORE_SUBMODULE_SHA=/' | tee -a evidence/environment.txt
          done
      - name: Install independent SDK versions
        shell: bash
        run: |
          set -euo pipefail
          for version in 1.27.2 1.36.1; do
            python -m venv "venv-$version"
            "venv-$version/bin/python" -m pip install -q --upgrade pip
            "venv-$version/bin/python" -m pip install -q "temporalio==$version"
            "venv-$version/bin/python" -c 'import temporalio.bridge,temporalio.service,pathlib,hashlib; root=pathlib.Path(temporalio.bridge.__file__).parent; binary=next(root.glob("*.so")); print("SDK="+temporalio.service.__version__,"BRIDGE="+str(binary),"BRIDGE_SHA256="+hashlib.sha256(binary.read_bytes()).hexdigest())' | tee -a evidence/environment.txt
          done
      - name: Acquire one shared Temporal dev server binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .devserver
          cat > /tmp/acquire_cli.py <<'PY'
          import asyncio
          from temporalio.testing import WorkflowEnvironment
          async def main():
              async with await WorkflowEnvironment.start_local(download_dest_dir='.devserver'):
                  print('COMMON_SERVER_BOOT=PASS')
          asyncio.run(main())
          PY
          timeout 240 venv-1.36.1/bin/python -u /tmp/acquire_cli.py | tee -a evidence/environment.txt
          find .devserver -type f -print | tee -a evidence/environment.txt
          CLI="$(find .devserver -type f -perm /u+x | head -n 1)"
          test -n "$CLI"
          CLI="$(realpath "$CLI")"
          echo "TEMPORAL_CLI_PATH=$CLI" >> "$GITHUB_ENV"
          "$CLI" --version | tee -a evidence/environment.txt
          sha256sum "$CLI" | tee -a evidence/environment.txt
      - name: Original issue 1578 on SDK 1.27.2
        shell: bash
        env:
          SDK_VERSION: '1.27.2'
          EVIDENCE_DIR: evidence
        run: |
          set -euo pipefail
          timeout 600 venv-1.27.2/bin/python -u runner.py --mode generate --repeats 4 | tee evidence/original-1.27.2.log
      - name: Confirm original reproducer before comparison
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(x) for x in Path('evidence/results.jsonl').read_text().splitlines()]
          captures = [x for x in records if x['phase']=='history_capture' and x['sdk']=='1.27.2']
          failures = [x for x in records if x['phase']=='same_version_replay' and x['sdk']=='1.27.2' and x['status']=='FAIL']
          print('HISTORIES=',len(captures),'REPLAY_FAILURES=',len(failures))
          if not captures or not failures:
              raise SystemExit('STOP: original 1.27.2 reproducer did not fail on a saved replay; setup not validated')
          PY
      - name: Replay SDK 1.27.2 histories on 1.36.1
        shell: bash
        env:
          SDK_VERSION: '1.36.1'
          EVIDENCE_DIR: evidence
        run: |
          set -euo pipefail
          timeout 600 venv-1.36.1/bin/python -u runner.py --mode replay --source-dir evidence/histories/1.27.2 | tee evidence/cross-replay.log
      - name: Original issue 1578 on SDK 1.36.1
        shell: bash
        env:
          SDK_VERSION: '1.36.1'
          EVIDENCE_DIR: evidence
        run: |
          set -euo pipefail
          timeout 600 venv-1.36.1/bin/python -u runner.py --mode generate --repeats 4 | tee evidence/original-1.36.1.log
      - name: Verify history and event counts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('evidence/results.jsonl').read_text().splitlines()]
          for version in ('1.27.2','1.36.1'):
              captures=[x for x in rows if x.get('phase')=='history_capture' and x.get('sdk')==version]
              runs=[x for x in rows if x.get('phase')=='original_test' and x.get('sdk')==version]
              print(version,'original_runs=',len(runs),'histories=',len(captures),'results=',[x['status'] for x in runs])
              for capture in captures:
                  assert Path(capture['file']).is_file()
                  assert capture['event_count']>0
          PY
      - name: Upload saved histories and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
